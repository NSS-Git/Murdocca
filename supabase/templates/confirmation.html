<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <title>Murdocca</title>
  </head>
  <body style="margin:0; padding:0; background-color:#1b2030; color:#2a2416; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background-color:#1b2030;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px; background-color:#ece4d1; border:1px solid #b8935a;">
            <tr>
              <td style="padding:32px 28px 28px;">
                <h1 style="margin:0 0 22px; color:#1b2030; font-family:Georgia, 'Times New Roman', serif; font-size:30px; line-height:1.2;">Murdocca</h1>
                <p style="margin:24px 0 14px; font-size:16px; line-height:1.6;">Has solicitado crear una cuenta en Murdocca.</p>
                <p style="margin:0 0 24px; font-size:16px; line-height:1.6;">Tu expediente está preparado. Confirma tu correo para comenzar la investigación.</p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;">
                  <tr>
                    <td align="center" bgcolor="#9c2b2b" style="border-radius:4px;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:14px 22px; border:1px solid #6e1c1c; border-radius:4px; color:#ffffff; font-size:16px; font-weight:bold; line-height:1.2; text-decoration:none;">Confirmar correo</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0; color:#5c5340; font-size:13px; line-height:1.6;">Si no has solicitado esta cuenta, ignora este mensaje.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
